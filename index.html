<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake Game</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 10px;
      background: #161b26;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    h2 { margin: 8px 0; font-size: 22px; }

    #game {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }

    canvas {
      max-width: 95vw;
      max-height: 55vh;
      width: auto !important;
      height: auto !important;
      border: 2px solid #64ff96;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(100, 255, 150, 0.15);
    }

    .controls {
      display: grid;
      grid-template-columns: 70px 70px 70px;
      gap: 10px;
      justify-content: center;
      margin: 10px auto;
    }

    button {
      height: 60px;
      font-size: 26px;
      border: none;
      border-radius: 14px;
      background: #2dc873;
      color: #102018;
      font-weight: bold;
      touch-action: manipulation;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: background 0.1s, transform 0.1s;
    }

    button:active {
      background: #23a05c;
      transform: scale(0.95);
    }

    .empty { visibility: hidden; }

    .btn-restart {
      padding: 10px 28px;
      font-size: 18px;
      width: auto;
      height: auto;
      background: #64ff96;
      margin-top: 5px;
    }
  </style>
</head>

<body>
  <h2>🐍 Snake Game</h2>
  <div id="game"></div>

  <div class="controls">
    <button class="empty"></button>
    <button onclick="move(0,-1)">⬆️</button>
    <button class="empty"></button>

    <button onclick="move(-1,0)">⬅️</button>
    <button onclick="move(0,1)">⬇️</button>
    <button onclick="move(1,0)">➡️</button>
  </div>

  <button class="btn-restart" onclick="restart()">Restart</button>

<script>
let snake, food, score, over, started;
let size = 20, cols, rows;
let direction, nextDirection;

function setup() {
  let c = createCanvas(360, 400);
  c.parent("game");
  frameRate(8);
  cols = width / size;
  rows = height / size;
  restart();
}

function restart() {
  snake = [
    {x: 9, y: 10},
    {x: 8, y: 10},
    {x: 7, y: 10}
  ];
  direction = {x: 1, y: 0};
  nextDirection = {x: 1, y: 0};
  score = 0;
  over = false;
  started = false;
  placeFood();
}

function placeFood() {
  do {
    food = {
      x: floor(random(cols)),
      y: floor(random(rows))
    };
  } while (snake.some(p => p.x === food.x && p.y === food.y));
}

function move(x, y) {
  if (over) {
    restart();
    return;
  }

  if (x !== -direction.x || y !== -direction.y) {
    nextDirection = {x, y};
    started = true;
  }
}

// Global window event listener to ensure arrow keys work reliably in desktop browsers
window.addEventListener('keydown', function(e) {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
    e.preventDefault(); // Prevent page scrolling
  }
  
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') move(0, -1);
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') move(0, 1);
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') move((-1, 0) || -1, 0); // fixed
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') move(1, 0);
  if (e.key === 'r' || e.key === 'R') restart();
});

// Fix syntax in event listener for left arrow
window.addEventListener('keydown', function(e) {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
    e.preventDefault();
  }
  if (e.key === 'ArrowUp') move(0, -1);
  if (e.key === 'ArrowDown') move(0, 1);
  if (e.key === 'ArrowLeft') move(-1, 0);
  if (e.key === 'ArrowRight') move(1, 0);
  if (e.key === 'r' || e.key === 'R') restart();
});

function draw() {
  background(22, 27, 38);

  noStroke();
  fill(255, 85, 95);
  circle(food.x * size + size/2,
         food.y * size + size/2, size * 0.75);

  snake.forEach((p, i) => {
    fill(i === 0 ? '#64ff96' : '#2dc873');
    rect(p.x * size + 1, p.y * size + 1,
         size - 2, size - 2, 4);
  });

  fill(255);
  textSize(17);
  textAlign(LEFT, TOP);
  text("Score: " + score, 8, 8);

  if (!started && !over) {
    message("SNAKE", "Press Arrows or Tap to Start");
  }

  if (over) {
    message("GAME OVER", "Tap Restart or Press R");
  }

  if (!started || over) return;

  direction = {...nextDirection};

  let head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  let eating = head.x === food.x && head.y === food.y;

  // Wrap around the walls
  head.x = (head.x + cols) % cols;
  head.y = (head.y + rows) % rows;

  let body = eating ? snake : snake.slice(0, -1);

  if (body.some(p => p.x === head.x && p.y === head.y)) {
    over = true;
    return;
  }

  snake.unshift(head);

  if (eating) {
    score += 10;
    placeFood();
  } else {
    snake.pop();
  }
}

function message(title, subtitle) {
  fill(0, 0, 0, 190);
  rect(0, 0, width, height);

  textAlign(CENTER, CENTER);
  fill('#64ff96');
  textSize(28);
  text(title, width/2, height/2 - 20);

  fill(255);
  textSize(14);
  text(subtitle, width/2, height/2 + 18);
}
</script>
</body>
</html>
